openapi: 3.0.3
info:
  title: Policy API
  version: 1.0.0
  description: 'Insurance policies. Owner: Policy team.'
paths:
  /policies:
    get:
      operationId: searchPolicies
      parameters:
      - name: holder
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Matching policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
  /policies/{policyId}:
    get:
      operationId: getPolicy
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          description: Not found
  /policies/{policyId}/endorsements:
    post:
      operationId: requestEndorsement
      summary: Request a change to a policy
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndorsementRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - endorsementId
                - status
                properties:
                  endorsementId:
                    type: string
                  status:
                    type: string
components:
  schemas:
    Policy:
      type: object
      required:
      - policyId
      - status
      - holder
      - premiumDue
      properties:
        policyId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - LAPSED
          - CANCELLED
        holder:
          $ref: '#/components/schemas/Holder'
        premiumDue:
          type: object
          required:
          - amount
          - dueDate
          properties:
            amount:
              type: number
            dueDate:
              type: string
              format: date
        legacyCode:
          type: string
          description: Code from the old policy system
    Holder:
      type: object
      required:
      - name
      - email
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    EndorsementRequest:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - ADDRESS
          - NOMINEE
          - VEHICLE
        details:
          type: string
